apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: my-app
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: (Host(`localhost`) || Host(`mobapp.hamropasal.tech`)) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: djangoservice
          port: 8000
 tls:
   secretName: mobapp-tls
