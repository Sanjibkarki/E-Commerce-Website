# kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
    
  - role: worker
    extraMounts:
      - hostPath: /home/sanjeev/E-Commerce-Website/certs
        containerPath: /etc/nginx/certs

      - hostPath: /home/sanjeev/E-Commerce-Website/static
        containerPath: /app/static

      - hostPath: /home/sanjeev/E-Commerce-Website/media
        containerPath: /app/media
