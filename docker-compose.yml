services:
  web:
    build: .
    image: sanjeeb3334/django_web:latest
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media 
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: red-is
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    container_name: ngi-nx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/nginx.conf:/etc/nginx/conf.d/nginx.conf
      - ./certs:/etc/certs
      - static_volume:/app/static
      - media_volume:/app/media 
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
  redis_data:
